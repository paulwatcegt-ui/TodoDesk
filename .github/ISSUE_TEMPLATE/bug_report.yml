name: Bug report
description: Report a reproducible DaiBan problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not attach real personal todo data, screenshots containing private notes, signing certificates, or passwords.
  - type: input
    id: version
    attributes:
      label: DaiBan version
      description: Shown in Settings, for example DaiBan 1.1.0.
      placeholder: DaiBan 1.1.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Use Win+R → winver if you are not sure.
      placeholder: Windows 11 24H2 (26100)
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Appearance
      options:
        - Follow system
        - Light
        - Dark
        - Not related
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Choose...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Checklist
      options:
        - label: I am using Windows 11.
          required: true
        - label: I removed personal task text and secrets from screenshots/logs.
          required: true
