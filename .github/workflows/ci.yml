name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Windows app
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate scripts, XAML and themes
        shell: cmd
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\tests\validate.ps1

      - name: Package smoke test
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\package.ps1
