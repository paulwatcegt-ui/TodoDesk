name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate and build native app
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate scripts, XAML and themes
        shell: cmd
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\tests\validate.ps1

      - name: Build native DaiBan.exe
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\host\build.ps1

      - name: Verify native executable
        shell: cmd
        run: if not exist dist\native\DaiBan.exe exit 1

      - name: Verify embedded module with restricted execution policy
        shell: cmd
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\tests\native-policy.ps1

      - name: Verify task interactions and persistence
        shell: cmd
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\tests\smoke.ps1

      - name: Verify native caption and window controls
        shell: cmd
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\tests\window.ps1

      - name: Verify local reminders and compact labels
        shell: cmd
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\tests\reminders.ps1

      - name: Verify reminder callbacks from actual app entry
        shell: cmd
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\tests\reminder-entry.ps1

      - name: Verify task priorities and legacy data
        shell: cmd
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\tests\priorities.ps1

      - name: Verify feature switches and inline editing
        shell: cmd
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\tests\features.ps1

      - name: Verify recycle bin, archive and auto-add
        shell: cmd
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\tests\lifecycle.ps1

      - name: Verify task ordering, timers and time statistics
        shell: cmd
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\tests\tracking.ps1

      - name: Verify backup import and individual trash deletion
        shell: cmd
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\tests\backup.ps1

      - name: Verify same-priority order and drag feedback
        shell: cmd
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\tests\polish.ps1

      - name: Verify priority keyboard focus and statistics display filters
        shell: cmd
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\tests\statistics-display.ps1
