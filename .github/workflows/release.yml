name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build release
    runs-on: windows-latest

    env:
      SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
      SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate scripts, XAML and themes
        shell: cmd
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\tests\validate.ps1

      - name: Sign PowerShell entry points (optional)
        if: env.SIGNING_PFX_BASE64 != ''
        shell: powershell
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'DaiBan-signing.pfx'
          [IO.File]::WriteAllBytes(
            $pfx,
            [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          try {
            .\scripts\sign.ps1 -PfxPath $pfx -Password $env:SIGNING_PFX_PASSWORD
          }
          finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Check tag matches AppVersion
        shell: powershell
        run: |
          $source = [IO.File]::ReadAllText('app\DaiBan.ps1', [Text.Encoding]::UTF8)
          $match = [regex]::Match($source, "\`$script:AppVersion\s*=\s*'([^']+)'")
          if (-not $match.Success) {
            throw 'AppVersion was not found in app\DaiBan.ps1.'
          }
          $expected = 'v' + $match.Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag $($env:GITHUB_REF_NAME) does not match $expected."
          }

      - name: Package
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\package.ps1

      - name: Publish GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @()
          $assets += (Get-ChildItem .\dist\*.zip | Select-Object -ExpandProperty FullName)
          $assets += (Get-ChildItem .\dist\*.sha256 | Select-Object -ExpandProperty FullName)
          gh release create $env:GITHUB_REF_NAME $assets `
            --title "DaiBan $env:GITHUB_REF_NAME" `
            --notes-file RELEASE_NOTES.md
